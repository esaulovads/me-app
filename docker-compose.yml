version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: me-app-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - me-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: me-app-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb
      MONGO_INITDB_DATABASE: auth_db
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - me-app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  auth-service:
    build:
      context: ./apps/backend/auth-service
      dockerfile: Dockerfile
    container_name: me-app-auth
    env_file:
      - ./apps/backend/auth-service/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:mongodb@mongodb:27017/auth_db?authSource=admin
      - JWT_SECRET=your_jwt_secret_key
      - JWT_EXPIRES_IN=1d
      - PORT=3000
    ports:
      - "${AUTH_SERVICE_PORT:-3000}:3000"
    networks:
      - me-app-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  profile-service:
    build:
      context: ./apps/backend/profile-service
      dockerfile: Dockerfile
    container_name: me-app-profile
    env_file:
      - ./apps/backend/profile-service/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=fitness_profiles
    ports:
      - "${PROFILE_SERVICE_PORT:-3001}:3001"
    networks:
      - me-app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nutrition-service:
    build:
      context: ./apps/backend/nutrition-service
      dockerfile: Dockerfile
    container_name: me-app-nutrition
    env_file:
      - ./apps/backend/nutrition-service/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=fitness_nutrition
    ports:
      - "${NUTRITION_SERVICE_PORT:-3002}:3002"
    networks:
      - me-app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  sleep-service:
    build:
      context: ./apps/backend/sleep-service
      dockerfile: Dockerfile
    container_name: me-app-sleep
    env_file:
      - ./apps/backend/sleep-service/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=fitness_sleep
    ports:
      - "${SLEEP_SERVICE_PORT:-3003}:3003"
    networks:
      - me-app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  activity-service:
    build:
      context: ./apps/backend/activity-service
      dockerfile: Dockerfile
    container_name: me-app-activity
    env_file:
      - ./apps/backend/activity-service/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=fitness_activity
      - PORT=3004
    ports:
      - "${ACTIVITY_SERVICE_PORT:-3004}:3004"
    networks:
      - me-app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  me-app-network:
    name: me-app-network
    driver: bridge

volumes:
  postgres_data:
  mongodb_data: 